<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnalyzeAI – Study Scheduler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>📚 AnalyzeAI</h1>
        <p>Upload your syllabus and get a personalized study schedule + quiz</p>
    </header>

    <main>
        <div class="form-card">

            <!-- File Upload -->
            <div class="form-group">
                <label>📎 Upload Syllabus (PDF or TXT)</label>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept=".pdf,.txt" onchange="uploadFile()">
                    <p>Click to upload or drag & drop a PDF / TXT file</p>
                </div>
                <div id="uploadStatus"></div>
            </div>

            <div class="divider">— or type manually —</div>

            <!-- Topics Input -->
            <div class="form-group">
                <label>Enter Topics (one per line or comma separated)</label>
                <textarea id="topics" rows="6"
                placeholder="e.g. Arrays&#10;Linked Lists&#10;Trees&#10;Graphs&#10;Dynamic Programming"></textarea>
            </div>

            <!-- Days and Hours -->
            <div class="form-row">
                <div class="form-group">
                    <label>Number of Days</label>
                    <input type="number" id="days" value="7" min="1" max="60">
                </div>
                <div class="form-group">
                    <label>Hours per Day</label>
                    <input type="number" id="hours" value="2" min="1" max="12" step="0.5">
                </div>
            </div>

            <button id="generateBtn" onclick="generateSchedule()">
                Generate Schedule
            </button>

        </div>

        <!-- Schedule Output -->
        <div id="output"></div>

        <!-- Quiz Section -->
        <div id="quizSection" style="display:none;">
            <div class="form-card">
                <h2 style="margin-bottom:16px;">🧠 Quiz from Your Syllabus</h2>
                <button id="quizBtn" onclick="generateQuiz()">
                    Generate Quiz
                </button>
            </div>
            <div id="quizOutput"></div>
        </div>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
